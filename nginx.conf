# =============================================================================
# BoringHannover Nginx Configuration
# Optimized for static site serving with security headers
# =============================================================================

server {
    # Listen on 8080 for non-root container execution
    listen 8080;
    listen [::]:8080;
    server_name _;

    # When running behind a TLS reverse proxy, avoid leaking the internal
    # container port in any redirects.
    absolute_redirect off;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy - adjust as needed for your site
    # Notes:
    # - Astro may inline some scripts/styles; hence 'unsafe-inline'.
    # - Umami is proxied first-party under /s/, so no external origin is needed.
    # - Fonts are self-hosted, so no Google Fonts origins are allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-elem 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Resolved per request rather than pinned at startup, so a change to the
    # analytics host's Cloudflare IPs does not require a redeploy.
    resolver 127.0.0.11 valid=60s ipv6=off;
    set $umami_upstream "umami.fabriktakt.com";

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Cache static assets aggressively (hashed filenames from Astro)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache other static files
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Cache HTML for shorter duration
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # First-party analytics proxy.
    #
    # EasyPrivacy ships the rule "||umami.*/script.js|$script", which matches the
    # upstream's own URL, so every uBlock/AdGuard/Brave visitor silently drops out
    # of analytics. Serving the tracker from this origin under a neutral path
    # avoids that. The tracker derives its collect endpoint from its own src
    # directory, so /s/t.js posts to /s/api/send with no client-side config.
    #
    # Both are exact matches, so they take priority over the static-asset regex
    # above and the trailing-slash redirect below.
    location = /s/t.js {
        proxy_pass https://$umami_upstream/script.js;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        # The upstream sits behind Cloudflare too. Cloudflare rejects requests
        # that arrive carrying its own hop headers (a client-supplied
        # CF-Connecting-IP returns 403), and every request reaching this
        # container already has them, so drop them before the second hop.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";
    }

    location = /s/api/send {
        proxy_pass https://$umami_upstream/api/send;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        # The upstream sits behind Cloudflare too. Cloudflare rejects requests
        # that arrive carrying its own hop headers (a client-supplied
        # CF-Connecting-IP returns 403), and every request reaching this
        # container already has them, so drop them before the second hop.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";

        # Umami hashes the client IP into the visitor id and resolves country
        # from it. This request reaches the upstream through Cloudflare a second
        # time, which overwrites CF-Connecting-IP with this container's egress
        # IP, so the real address is forwarded in a header Cloudflare leaves
        # alone. Umami reads it via CLIENT_IP_HEADER.
        proxy_set_header X-BH-Client-IP $http_cf_connecting_ip;
    }

    # Main location - serve static files.
    # Prefer $uri/index.html so requesting "/datenschutz" does not trigger
    # nginx's directory-slash redirect to "/datenschutz/" (which can expose
    # the internal :8080 when proxied).
    #
    # Unknown paths must 404, never fall back to /index.html. A 200 + homepage
    # for every dead URL makes Google file expired /special/ pages as
    # "Alternate page with proper canonical tag" against the homepage.
    location / {
        # One URL per page: redirect extensionless paths to the trailing-slash
        # form Astro emits in <link rel="canonical">. Paths containing a dot
        # (assets, robots.txt, sitemap.xml) are left alone.
        if ($request_uri ~ ^([^.?]*[^/])(\?.*)?$) {
            return 301 $1/$2;
        }
        try_files $uri/index.html $uri =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Netlify/Cloudflare-Pages header file; unused here (headers are set above)
    # but Astro copies it into dist/, so keep it out of the crawlable surface.
    location = /_headers {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable logging for favicon and robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Reachable only through error_page, so /404.html itself can't be crawled
    # and indexed as a 200.
    location = /404.html {
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
