# Dependabot covers what the weekly dependency-refresh workflow does not:
# GitHub Action SHAs, base images, and frontend majors. Security updates are
# unaffected by these settings.
version: 2

updates:
  # uv.lock: dependency-refresh takes every update, majors included (flagged
  # for review), so version PRs are off; security PRs still arrive.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0
    labels: ["dependencies", "python"]

  # bun.lock: dependency-refresh stays within package.json ranges, so only
  # majors come from here.
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      semver-major-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Python and nginx base images. Bun and uv images are pinned by
  # dependency-refresh together with .bun-version and the CI env.
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      - dependency-name: "oven/bun"
      - dependency-name: "astral-sh/uv"
      - dependency-name: "ghcr.io/astral-sh/uv"
    groups:
      base-images-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # Actions are pinned to commit SHAs; Dependabot moves the SHA and its
  # version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
