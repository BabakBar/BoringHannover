# BoringHannover Deploy Pipeline
# Builds and pushes Docker images, triggers Coolify deployment.
#
# Every published image carries an SBOM and SLSA build provenance, and the
# immutable digest that was actually deployed is recorded in the run summary so
# a rollback has something to point at (see MAINTENANCE.md).

name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy backend"
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: "Deploy frontend"
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  SITE: https://boringhannover.de

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine what changed (backend vs frontend)
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      backend: ${{ steps.manual.outputs.backend || steps.push.outputs.backend }}
      frontend: ${{ steps.manual.outputs.frontend || steps.push.outputs.frontend }}

    steps:
      - name: Detect changes (push)
        id: push
        if: github.event_name == 'push'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Prefer compare base..head so multi-commit pushes are handled correctly.
          # Fall back to the single-commit endpoint if compare fails (e.g., unusual base SHA).
          if compare_json="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/compare/${BASE_SHA}...${HEAD_SHA}"
          )"; then
            files="$(printf '%s' "${compare_json}" | jq -r '.files[].filename')"
          else
            commit_json="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GH_REPO}/commits/${HEAD_SHA}"
            )"
            files="$(printf '%s' "${commit_json}" | jq -r '.files[].filename')"
          fi

          backend=false
          frontend=false

          while IFS= read -r file; do
            case "${file}" in
              src/*|Dockerfile|pyproject.toml|uv.lock)
                backend=true
                ;;
            esac

            case "${file}" in
              web/*|Dockerfile.web|nginx.conf)
                frontend=true
                ;;
            esac
          done < <(printf '%s\n' "${files}")

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"

      - name: Set changes from inputs (workflow_dispatch)
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          echo "backend=${{ inputs.deploy_backend }}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${{ inputs.deploy_frontend }}" >> "${GITHUB_OUTPUT}"

  # Build and push Docker images
  build:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required to sign the build provenance attestations.
      id-token: write
      attestations: write
    needs: changes
    if: github.ref == 'refs/heads/master' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      backend_digest: ${{ steps.build-backend.outputs.digest }}
      frontend_digest: ${{ steps.build-frontend.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image
      - name: Extract backend metadata
        id: meta-backend
        if: needs.changes.outputs.backend == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        id: build-backend
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

      - name: Attest backend provenance
        if: needs.changes.outputs.backend == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.build-backend.outputs.digest }}
          push-to-registry: true

      # Frontend image
      - name: Extract frontend metadata
        id: meta-frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        id: build-frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            SITE=${{ env.SITE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

      - name: Attest frontend provenance
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true

      # A published image that fails the gate must not reach production, so the
      # scan runs before the deploy job and blocks it on failure.
      - name: Scan published images
        env:
          BACKEND_REF: ${{ env.BACKEND_IMAGE }}@${{ steps.build-backend.outputs.digest }}
          FRONTEND_REF: ${{ env.FRONTEND_IMAGE }}@${{ steps.build-frontend.outputs.digest }}
          DO_BACKEND: ${{ needs.changes.outputs.backend }}
          DO_FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          set -euo pipefail
          scan() {
            docker run --rm \
              -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
              image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress "$1"
          }
          if [ "${DO_BACKEND}" = "true" ]; then scan "${BACKEND_REF}"; fi
          if [ "${DO_FRONTEND}" = "true" ]; then scan "${FRONTEND_REF}"; fi

  # Trigger Coolify deployment
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: github.ref == 'refs/heads/master'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Trigger backend deployment
        if: needs.changes.outputs.backend == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_WEBHOOK}" \
            --fail --silent --show-error

      - name: Trigger frontend deployment
        if: needs.changes.outputs.frontend == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_WEBHOOK}" \
            --fail --silent --show-error

      # The digest is the only rollback reference that cannot be moved:
      # `latest` and the sha tag both float, the digest does not.
      - name: Deployment summary
        env:
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
          BACKEND_TAGS: ${{ needs.build.outputs.backend_tag }}
          FRONTEND_TAGS: ${{ needs.build.outputs.frontend_tag }}
          DO_BACKEND: ${{ needs.changes.outputs.backend }}
          DO_FRONTEND: ${{ needs.changes.outputs.frontend }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Backend deployed:** ${DO_BACKEND}"
            echo "- **Backend tags:** ${BACKEND_TAGS:-n/a}"
            echo "- **Backend digest:** \`${BACKEND_DIGEST:-n/a}\`"
            echo "- **Frontend deployed:** ${DO_FRONTEND}"
            echo "- **Frontend tags:** ${FRONTEND_TAGS:-n/a}"
            echo "- **Frontend digest:** \`${FRONTEND_DIGEST:-n/a}\`"
            echo ""
            echo "Roll back by pinning the service to the previous digest:"
            echo '```'
            echo "docker pull ${BACKEND_IMAGE}@<digest>"
            echo "docker pull ${FRONTEND_IMAGE}@<digest>"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
