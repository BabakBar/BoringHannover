# Automated Repository Traffic Analytics Pipeline
# Captures daily views, clones, referrers, popular paths, stargazers, and forks
# to preserve repository history beyond GitHub's default 14-day window.
#
# Pushes the persistent dataset, markdown summary, and interactive HTML dashboard
# to the orphan 'traffic-data' branch without polluting the main commit history.

name: Traffic Analytics

permissions:
  contents: read

on:
  schedule:
    # Runs twice daily at 03:00 and 15:00 UTC to ensure in-progress day metrics
    # are continuously merged and no data is lost at rolling 14-day boundaries.
    - cron: "0 3,15 * * *"
  workflow_dispatch:

concurrency:
  group: traffic-analytics
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"

jobs:
  capture-traffic:
    name: Capture & Archive Traffic
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint GitHub App token (optional fallback)
        id: app-token
        if: env.HAS_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-administration: read

      - name: Checkout traffic-data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: traffic-data
          path: traffic-branch
          token: ${{ secrets.TRAFFIC_TOKEN || steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a269b596f7e8a5b23d91fb836ba33b0a234691a3 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run traffic capture
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN || steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/capture_traffic.py --repo "${GH_REPO}" --output-dir traffic-branch

      - name: Commit and push analytics update
        run: |
          set -euo pipefail
          cd traffic-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No traffic changes to commit."
            exit 0
          fi

          git commit -m "📊 Update repository traffic analytics [skip ci]"
          git push origin traffic-data
