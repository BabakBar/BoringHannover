# BoringHannover CI Pipeline
# Runs tests, linting, type checking and supply-chain gates on every PR and push.
#
# Every action is pinned to a commit SHA (a tag can be moved; a SHA cannot).
# Dependabot updates the SHA and the version comment together — see
# .github/dependabot.yml and MAINTENANCE.md.

name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths-ignore:
      - "web/output/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "web/output/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE: https://boringhannover.de
  # Toolchain pins. MAINTENANCE.md is the policy; these are the values,
  # and the `pins` job below asserts the container images agree with them.
  UV_VERSION: "0.12.6"
  PYTHON_PRODUCTION: "3.14"
  ZIZMOR_VERSION: "1.29.0"

jobs:
  # Toolchain pins must agree across CI, Dockerfiles and the dev stack.
  pins:
    name: Version pins in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert Bun version pins are in sync
        shell: bash
        run: |
          set -euo pipefail
          v="$(cat web/.bun-version)"
          echo "Expected Bun version: $v"
          grep -q "oven/bun:${v}" Dockerfile.web || { echo "ERROR: Dockerfile.web does not use oven/bun:${v}"; exit 1; }
          grep -q "image: oven/bun:${v}" docker-compose.yml || { echo "ERROR: docker-compose.yml does not use oven/bun:${v}"; exit 1; }
          echo "Bun pins are in sync"

      - name: Assert uv and Python pins are in sync
        shell: bash
        env:
          UV_VERSION: ${{ env.UV_VERSION }}
          PYTHON_PRODUCTION: ${{ env.PYTHON_PRODUCTION }}
        run: |
          set -euo pipefail
          grep -q "ghcr.io/astral-sh/uv:${UV_VERSION}" Dockerfile || { echo "ERROR: Dockerfile does not use uv ${UV_VERSION}"; exit 1; }
          grep -q "FROM python:${PYTHON_PRODUCTION}-slim" Dockerfile || { echo "ERROR: Dockerfile does not build on Python ${PYTHON_PRODUCTION}"; exit 1; }
          grep -qx "${PYTHON_PRODUCTION}" .python-version || { echo "ERROR: .python-version does not pin ${PYTHON_PRODUCTION}"; exit 1; }
          echo "uv and Python pins are in sync"

  # Backend: Python tests and quality checks across the supported interpreters.
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported and production runtime — both are tested so raising
        # the floor later is a one-line change, not an investigation.
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Assert the lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run linter (ruff)
        run: uv run ruff check src/

      - name: Check formatting (ruff)
        run: uv run ruff format --check src/

      - name: Run type checker (ty)
        run: uv run ty check src/

      - name: Run tests (pytest)
        run: uv run pytest tests/ -v --tb=short

      - name: Audit Python dependencies
        run: uv audit --preview-features audit-command

  # Frontend: build verification and dependency audit.
  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/.bun-version

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        working-directory: web
        run: bun audit

      - name: Run frontend tests
        working-directory: web
        run: bun run test

      - name: Build Astro site
        working-directory: web
        run: bun run build

      - name: Verify nginx routing contract
        run: ./scripts/smoke-routing.sh --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 7

  # Workflow hardening: catches unpinned actions, over-broad permissions and
  # template-injection sinks before they reach master.
  workflows:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx zizmor@${{ env.ZIZMOR_VERSION }} --persona=regular .github/workflows/

  # Docker: build verification.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: boringhannover-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          load: true
          tags: boringhannover-frontend:test
          build-args: |
            SITE=${{ env.SITE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy runs from its official image pinned by digest rather than via the
      # trivy-action: in March 2026 that action's version tags were force-pushed
      # in a supply-chain attack, and a digest cannot be moved.
      - name: Scan images for vulnerabilities
        run: |
          set -uo pipefail
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
              image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress "$1"
          }
          # Both images are scanned before failing, so one run reports every
          # finding instead of hiding the second image behind the first.
          failed=""
          scan boringhannover-backend:test || failed="${failed} backend"
          scan boringhannover-frontend:test || failed="${failed} frontend"
          if [ -n "${failed}" ]; then
            echo "::error::Vulnerable images:${failed}"
            exit 1
          fi
